name: Tests

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php_version: 7.4
          - php_version: 8.0
          - php_version: 8.1
          - php_version: 8.2
          - php_version: 8.3
          - php_version: 8.4
            include_coverage: true
    name: PHP ${{ matrix.php_version }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP Action ${{ matrix.php_version }}
      uses: shivammathur/setup-php@2.34.1
      with:
        php-version: '${{ matrix.php_version }}'
        tools: composer:2.2.15
        extensions: gd, imagick
        ini-values: error_reporting=E_ALL

    - name: Restore composer
      run: composer install

    - name: Run tests
      run: |
        ./vendor/bin/phpunit tests --bootstrap ./vendor/autoload.php

    - name: Run coverage
      if: ${{ matrix.include_coverage == true }}
      run: |
        mkdir coverage
        ./vendor/bin/phpunit tests --bootstrap ./vendor/autoload.php --coverage-html ./coverage --coverage-filter ./src --exclude benchmark

    - name: 'Upload coverage report'
      uses: actions/upload-artifact@v4
      if: ${{ matrix.include_coverage == true }}
      with:
        name: coverage
        path: ./coverage
